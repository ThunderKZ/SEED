<!DOCTYPE html>
<html>

<title>第八章-向烟火许愿吧</title>
<style>
.tips-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    padding: 20px;
    box-sizing: border-box;
}
.modal-content {
    background: white;
    border-radius: 16px;
    padding: 30px;
    max-width: 500px;
    width: 100%;
    box-sizing: border-box;
}
.modal-title {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #232323;
    margin-top: 0;
}
.modal-text {
    font-size: 20px;
    line-height: 1.8;
    color: #474747;
    margin-bottom: 20px;
}
.modal-text p {
    margin: 0 0 10px 0;
}
.modal-text p:last-child {
    margin-bottom: 0;
}
/* 重点文字虚线方框样式 */
.blue-text {
    display: inline-block;
    padding: 1px 1px;
    border: 4px dashed #0066cc;
    border-radius: 3px;
    color: black;
    font-weight: bold;
    margin: 0 2px;
}
.red-text {
    display: inline-block;
    padding: 1px 1px;
    border: 4px dashed #990000;
    border-radius: 3px;
    color: black;
    font-weight: bold;
    margin: 0 2px;
}
.close-modal-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 8px;
    background: #409eff;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s ease;
}
.close-modal-btn:hover {
    background: #337ecc;
}
.modal-btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 两列等分 */
    gap: 10px; /* 按钮间距 */
}
.tips-toggle-btn {
    position: fixed;
    bottom: 20px; /* 距离底部20px */
    right: 20px;  /* 距离右侧20px */
    width: 80px;
    height: 80px;
    background: #409eff;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
    z-index: 99998; /* 略低于弹窗，避免遮挡 */
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    transition: all 0.2s ease;
}
.tips-toggle-btn:hover {
    transform: scale(1.1); /* 悬浮放大 */
    background: #337ecc;
}
.feedback-btn {
    height: 48px;
    border: 1px solid #409eff; /* 边框式设计，区分主按钮 */
    border-radius: 8px;
    background: white;
    color: #409eff;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s ease;
}
.feedback-btn:hover {
    background: #f0f9ff;
}

/* 手机端角落按钮适配 */
@media (max-width: 375px) {
    .modal-content {
        padding: 20px;
    }
    .modal-title {
        font-size: 20px;
    }
    .modal-text {
        font-size: 18px;
    }
    .blue-text {
        padding: 1px 2px;
        border-width: 1px;
    }
    .red-text {
        padding: 1px 2px;
        border-width: 1px;
    }
    .close-modal-btn, .feedback-btn {
        height: 44px;
        font-size: 16px;
    }
    .tips-toggle-btn {
        width: 60px;
        height: 60px;
        font-size: 26px;
    }
}
</style>

    <button id="toggleBtn" style="width:40px; height:40px; font-size:20px; border:none; background:none; cursor:pointer; border-radius:6px;">▲</button>
  </div>

  <!-- 可收起内容区 -->
  <div id="panelContent">
    <!-- 缩放按钮行 -->
    <div style="display: flex; gap: 10px; margin-bottom: 12px; justify-content: center;">
      <button id="zoomInBtn" style="width: 80px; height: 80px; font-size: 36px; cursor: pointer; border: none; border-radius: 8px; background: #f8f9fa; transition: 0.2s;" onclick="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onmouseout="this.style.transform='scale(1)'">➕</button>
      <button id="zoomOutBtn" style="width: 80px; height: 80px; font-size: 36px; cursor: pointer; border: none; border-radius: 8px; background: #f8f9fa; transition: 0.2s;" onclick="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onmouseout="this.style.transform='scale(1)'">➖</button>
      <button id="zoomResetBtn" style="width: 80px; height: 80px; font-size: 36px; cursor: pointer; border: none; border-radius: 8px; background: #f8f9fa; transition: 0.2s;" onclick="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onmouseout="this.style.transform='scale(1)'">↺</button>
    </div>

    <!-- 摇杆式方向键（键盘方向布局） -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <button id="panUpBtn" style="width: 80px; height: 80px; font-size: 36px; cursor: pointer; border: none; border-radius: 8px; background: #e9ecef; transition: 0.2s;" onclick="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onmouseout="this.style.transform='scale(1)'">⇑</button>
      <div style="display: flex; gap: 10px;">
        <button id="panLeftBtn" style="width: 80px; height: 80px; font-size: 36px; cursor: pointer; border: none; border-radius: 8px; background: #e9ecef; transition: 0.2s;" onclick="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onmouseout="this.style.transform='scale(1)'">⇐</button>
        <button id="panDownBtn" style="width: 80px; height: 80px; font-size: 36px; cursor: pointer; border: none; border-radius: 8px; background: #e9ecef; transition: 0.2s;" onclick="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onmouseout="this.style.transform='scale(1)'">⇓</button>
        <button id="panRightBtn" style="width: 80px; height: 80px; font-size: 36px; cursor: pointer; border: none; border-radius: 8px; background: #e9ecef; transition: 0.2s;" onclick="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onmouseout="this.style.transform='scale(1)'">⇒</button>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 拖动 + 展开/收起 ====================
(function() {
  const panel = document.getElementById("controlPanel");
  const handle = document.getElementById("dragHandle");
  const toggleBtn = document.getElementById("toggleBtn");
  const content = document.getElementById("panelContent");
  let isDragging = false, startX, startY, left, top;

  // 仅拖动时阻止页面滚动，不影响按钮点击
  handle.addEventListener('touchstart', function(e) {
    isDragging = true;
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    left = panel.offsetLeft;
    top = panel.offsetTop;
  }, { passive: true });

  handle.addEventListener('mousedown', function(e) {
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    left = panel.offsetLeft;
    top = panel.offsetTop;
  });

  // 拖动中：阻止页面滚动
  document.addEventListener('touchmove', function(e) {
    if (isDragging) {
      e.preventDefault();
      const t = e.touches[0];
      const x = left + t.clientX - startX;
      const y = top + t.clientY - startY;
      panel.style.left = x + "px";
      panel.style.top = y + "px";
      panel.style.right = "auto";
    }
  }, { passive: false });

  document.addEventListener('mousemove', function(e) {
    if (isDragging) {
      const x = left + e.clientX - startX;
      const y = top + e.clientY - startY;
      panel.style.left = x + "px";
      panel.style.top = y + "px";
      panel.style.right = "auto";
    }
  });

  // 结束拖动
  document.addEventListener('touchend', function() { isDragging = false; });
  document.addEventListener('touchcancel', function() { isDragging = false; });
  document.addEventListener('mouseup', function() { isDragging = false; });

  // 展开/收起（100%可用）
  toggleBtn.onclick = function() {
    if (content.style.display === "none") {
      content.style.display = "block";
      toggleBtn.textContent = "▲";
    } else {
      content.style.display = "none";
      toggleBtn.textContent = "▼";
    }
  };
})();

(function() {
  function initControls() {
    let graphContainer = document.querySelector('.mxgraph > div');
    if (!graphContainer) graphContainer = document.querySelector('.mxgraph');
    if (!graphContainer) return false;

    let graphContent = graphContainer.children[0];
    if (!graphContent) return false;

    let originalWidth = graphContent.clientWidth;
    let originalHeight = graphContent.clientHeight;
    if (originalWidth === 0 || originalHeight === 0) {
      originalWidth = graphContainer.clientWidth;
      originalHeight = graphContainer.clientHeight;
    }

    graphContainer.style.position = 'relative';
    graphContainer.style.overflow = 'auto';
    graphContainer.style.webkitOverflowScrolling = 'touch';

    let placeholder = document.createElement('div');
    placeholder.style.width = originalWidth + 'px';
    placeholder.style.height = originalHeight + 'px';
    placeholder.style.pointerEvents = 'none';
    graphContainer.appendChild(placeholder);

    graphContent.style.position = 'absolute';
    graphContent.style.top = '0';
    graphContent.style.left = '0';
    graphContent.style.transformOrigin = '0 0';

    let scale = 1;
    const step = 0.2;
    const minScale = 0.2;
    const maxScale = 3;
    const panStep = 50;

    function updateScale() {
      graphContent.style.transform = `scale(${scale})`;
      placeholder.style.width = (originalWidth * scale) + 'px';
      placeholder.style.height = (originalHeight * scale) + 'px';
    }

    document.getElementById('zoomInBtn').addEventListener('click', function() {
      scale = Math.min(scale + step, maxScale);
      updateScale();
    });
    document.getElementById('zoomOutBtn').addEventListener('click', function() {
      scale = Math.max(scale - step, minScale);
      updateScale();
    });
    document.getElementById('zoomResetBtn').addEventListener('click', function() {
      scale = 1;
      updateScale();
    });

    document.getElementById('panUpBtn').addEventListener('click', function() {
      graphContainer.scrollTop -= panStep;
    });
    document.getElementById('panDownBtn').addEventListener('click', function() {
      graphContainer.scrollTop += panStep;
    });
    document.getElementById('panLeftBtn').addEventListener('click', function() {
      graphContainer.scrollLeft -= panStep;
    });
    document.getElementById('panRightBtn').addEventListener('click', function() {
      graphContainer.scrollLeft += panStep;
    });

    return true;
  }

  if (!initControls()) {
    const interval = setInterval(function() {
      if (initControls()) clearInterval(interval);
    }, 500);
  }
})();

// 弹窗部分 
(function() {
    const tipsModal = document.getElementById('tipsModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const tipsToggleBtn = document.getElementById('tipsToggleBtn');
    const feedbackBtn = document.getElementById('feedbackBtn');
    
    // 👇 关键配置：替换为你的第三方问卷链接（腾讯问卷/金数据等）
    const FEEDBACK_URL = 'https://v.wjx.cn/vm/Yk92DWx.aspx'; 

    let isFirstOpen = true;

    // 关闭弹窗：缩至角落
    function closeModal() {
        tipsModal.style.display = 'none';
        tipsToggleBtn.style.display = 'flex';
        isFirstOpen = false;
    }

    // 打开弹窗：展开全屏
    function openModal() {
        tipsModal.style.display = 'flex';
        tipsToggleBtn.style.display = 'none';
    }

    // 初始状态：首次打开显示弹窗
    closeModal();

    // 点击「我知道了」：缩至角落
    closeModalBtn.addEventListener('click', closeModal);

    // 👇 新增：点击「意见反馈」：跳转至第三方问卷（新标签页打开，不关闭原页面）
    feedbackBtn.addEventListener('click', () => {
        window.open(FEEDBACK_URL, '_blank'); 
        // 可选：跳转后自动缩至角落（取消注释即可）
        // closeModal();
    });

    // 点击角落按钮：重新展开弹窗
    tipsToggleBtn.addEventListener('click', openModal);

    // 可选：点击遮罩层关闭弹窗
    // tipsModal.addEventListener('click', (e) => {
    //     if (e.target === tipsModal) {
    //         closeModal();
    //     }
    // });
})();

</script>

</body>
